# Simple Blog 配置（克隆后改成你自己的站点信息）
title: "Simple Blog"
description: "简洁现代的静态博客"
author: "Your Name"
url: "https://your-blog.vercel.app"
posts_per_page: 10

# 默认读取仓库内 posts/。对接 markdown-press 时改为 "../posts"
posts_source: "posts"

# 社交链接
social:
  github: ""
  twitter: ""
  email: ""

# 网站设置
footer: "© 2026 Simple Blog. All rights reserved."

# Giscus 评论：默认关闭。启用前到 https://giscus.app 安装 GitHub App，
# 再填入你自己的 repo、repo_id、category、category_id。
giscus:
  enabled: false
  repo: ""
  repo_id: ""
  category: ""
  category_id: ""
  mapping: "pathname"
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: "bottom"
  theme: "preferred_color_scheme"
  lang: "zh-CN"
